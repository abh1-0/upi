<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radiant Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0A1128" />
    </linearGradient>

    <!-- Outer Tech Glow Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D26A" />
      <stop offset="50%" stop-color="#0084FF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- UPI Forward Arrows Gradient (Green to Cyan) -->
    <linearGradient id="arrowGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>

    <!-- Saffron / Orange Energy Flash -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#FF5722" />
    </linearGradient>

    <!-- Studio Electric Beam -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D26A" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0084FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Subtle Stroke -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Ambient Glow Behind Elements -->
  <circle cx="256" cy="256" r="140" fill="url(#arrowGreen)" opacity="0.12" filter="url(#softGlow)" />

  <!-- Studio Viewfinder / Aperture QR Corner Markers (Symbolizing Studio & Precision QR) -->
  <!-- Top Left Corner Marker -->
  <path d="M 88 150 L 88 112 A 24 24 0 0 1 112 88 L 150 88" fill="none" stroke="#00D26A" stroke-width="12" stroke-linecap="round" />
  <rect x="120" y="120" width="28" height="28" rx="8" fill="#00D26A" />

  <!-- Top Right Corner Marker -->
  <path d="M 362 88 L 400 88 A 24 24 0 0 1 424 112 L 424 150" fill="none" stroke="#0084FF" stroke-width="12" stroke-linecap="round" />
  <rect x="364" y="120" width="28" height="28" rx="8" fill="#0084FF" />

  <!-- Bottom Left Corner Marker -->
  <path d="M 88 362 L 88 400 A 24 24 0 0 0 112 424 L 150 424" fill="none" stroke="#8B5CF6" stroke-width="12" stroke-linecap="round" />
  <rect x="120" y="364" width="28" height="28" rx="8" fill="#8B5CF6" />

  <!-- Bottom Right "Studio Play / Record Dot" -->
  <circle cx="394" cy="394" r="18" fill="#FF9933" filter="url(#neonGlow)" />

  <!-- Central Emblem: Fusion of UPI Dynamic Slanted Chevrons + Studio Studio Lightning Core -->
  <g transform="translate(256,256) scale(1.15)">
    <!-- Back Slanted Arrow (Orange / Saffron Speed Fin) -->
    <path d="M -85 -55 L -45 -95 L -5 -95 L -45 -55 Z" fill="url(#orangeGrad)" opacity="0.9" filter="url(#neonGlow)" />

    <!-- Left NPCI Style Dual Fast Forward Chevron (Green) -->
    <path d="M -75 25 L -25 -25 L -5 -25 L -55 25 Z" fill="url(#arrowGreen)" />
    <path d="M -40 25 L 10 -25 L 30 -25 L -20 25 Z" fill="url(#arrowGreen)" />

    <!-- High-Impact Studio Lightning Bolt / Pulse piercing through center -->
    <path d="M 15 -110 L -45 5 L 5 5 L -15 105 L 65 -15 L 15 -15 Z" 
          fill="url(#ringGrad)" 
          stroke="#FFFFFF" 
          stroke-width="4" 
          stroke-linejoin="round"
          filter="url(#neonGlow)" />

    <!-- Center Core Spark -->
    <circle cx="10" cy="-5" r="7" fill="#FFFFFF" />
  </g>

  <!-- Futuristic Studio Scanner Beam Across Center -->
  <line x1="90" y1="256" x2="422" y2="256" stroke="url(#beamGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.75" />
</svg>
